aid: kasten
name: Kasten
description: >-
  Veeam Kasten (formerly Kasten K10) is an enterprise-grade, Kubernetes-native data
  protection platform. It delivers backup and recovery, disaster recovery,
  application mobility, ransomware resilience, and virtual-machine (KubeVirt)
  protection through policy-driven automation, and runs inside the customer's own
  Kubernetes cluster. Its programmable surface is a set of Kubernetes Custom
  Resources (policies, restore points, backup/restore/export actions) plus an
  in-cluster REST API served through the K10 gateway, authenticated with Kubernetes
  bearer tokens. Kasten was acquired by Veeam and its brand now sits under Veeam's
  Kubernetes data-protection line.
